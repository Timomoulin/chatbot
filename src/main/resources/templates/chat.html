
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Assistant IA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            height: 100vh;
            overflow-y: auto;
        }

        .chat-content {
            height: 100vh;
            overflow-y: auto;
        }

        .message {
            white-space: pre-wrap;
            padding: 15px;
            border-radius: 10px;
            background: #f1f1f1;
        }
    </style>
</head>

<body>

<div class="d-flex">

    <!-- Barre latérale -->
    <aside class="sidebar bg-dark text-white p-3">

        <h4 class="mb-4">Assistant IA</h4>

        <a th:href="@{/}"
           class="btn btn-outline-light w-100 mb-4">
            + Nouvelle conversation
        </a>

        <h6 class="text-secondary">Historique</h6>

        <div class="list-group">

            <a th:each="c : ${conversations}"
               th:href="@{/conversations/{id}(id=${c.id})}"
               th:text="${c.titre}"
               class="list-group-item list-group-item-action"
               th:classappend="${conversation != null and conversation.id == c.id} ? 'active' : ''">
            </a>

        </div>

    </aside>

    <!-- Zone principale -->
    <main class="chat-content flex-grow-1 d-flex flex-column">

        <!-- En-tête -->
        <header class="border-bottom p-3">
            <h5 class="mb-0"
                th:text="${conversation != null ? conversation.titre : 'Nouvelle conversation'}">
                Assistant IA
            </h5>
        </header>

        <!-- Messages -->
        <section class="flex-grow-1 overflow-auto p-4">

            <div th:if="${conversation == null}"
                 class="text-center mt-5">

                <h2>Comment puis-je vous aider ?</h2>
                <p class="text-muted">
                    Posez votre première question à Mistral.
                </p>

            </div>

            <div th:each="message : ${messages}"
                 class="mb-4">

                <strong
                        th:text="${message.typeMessage}">
                </strong>

                <div class="message mt-2"
                     th:text="${message.contenu}">
                </div>

            </div>

        </section>

        <!-- Formulaire -->
        <footer class="border-top p-3">

            <form th:if="${conversation == null}"
                  th:action="@{/conversations}"
                  method="post">

                <div class="input-group">
                    <textarea name="prompt"
                              class="form-control"
                              rows="2"
                              placeholder="Posez votre question..."
                              required></textarea>

                    <button class="btn btn-primary" type="submit">
                        Envoyer
                    </button>
                </div>

            </form>

            <form th:if="${conversation != null}"
                  th:action="@{/conversations/{id}/messages(id=${conversation.id})}"
                  method="post">

                <div class="input-group">
                    <textarea name="prompt"
                              class="form-control"
                              rows="2"
                              placeholder="Écrivez votre message..."
                              required></textarea>

                    <button class="btn btn-primary" type="submit">
                        Envoyer
                    </button>
                </div>

            </form>

        </footer>

    </main>

</div>

</body>
</html>
