
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Assistant IA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>

<body>

<div class="d-flex">

    <!-- Barre latérale -->
    <aside class="sidebar bg-dark text-white p-3">

        <h4 class="mb-4">Assistant IA</h4>

        <a th:href="@{/}"
           class="btn btn-outline-light w-100 mb-4">
            + Nouvelle conversation
        </a>

        <h6 class="text-secondary">Historique</h6>

        <div class="list-group">

            <a th:each="c : ${conversations}"
               th:href="@{/conversations/{id}(id=${c.id})}"
               th:text="${c.titre}"
               class="list-group-item list-group-item-action"
               th:classappend="${conversation != null and conversation.id == c.id} ? 'active' : ''">
            </a>

        </div>

    </aside>

    <!-- Zone principale -->
    <main class="chat-content flex-grow-1 d-flex flex-column">

        <!-- En-tête -->

        <header class="border-bottom p-3">

            <div class="d-flex justify-content-between align-items-center">

                <h5 class="mb-0"
                    th:text="${conversation != null ? conversation.titre : 'Nouvelle conversation'}">
                </h5>

                <!-- Nouvelle conversation : choix du modèle -->
                <div th:if="${conversation == null}">

                    <select name="idModele"
                            form="formChat"
                            class="form-select"
                            required>

                        <option value="" disabled selected>
                            Choisir un modèle IA
                        </option>

                        <option th:each="modele : ${modeles}"
                                th:value="${modele.id}"
                                th:text="${modele.nom}">
                        </option>

                    </select>

                </div>

                <!-- Conversation existante : affichage du modèle -->
                <div th:if="${conversation != null}"
                     class="d-flex align-items-center gap-2">

                    <img th:src="@{${conversation.modeleIA.cheminLogo}}"
                         alt="Logo du modèle"
                         width="28"
                         height="28">

                    <span class="badge bg-secondary"
                          th:text="${conversation.modeleIA.nom}">
            </span>

                </div>

            </div>

        </header>


        <!-- Messages -->
        <section class="flex-grow-1 overflow-auto p-4">

            <div th:if="${conversation == null}"
                 class="text-center mt-5">

                <h2>Comment puis-je vous aider ?</h2>
                <p class="text-muted">
                    Posez votre première question à Mistral.
                </p>

            </div>

            <div th:each="message : ${messages}"
                 class="mb-4">

                <strong
                        th:text="${message.typeMessage}">
                </strong>

                <div class="message mt-2 message-content"

                     th:text="${message.contenu}">
                </div>

            </div>

        </section>

        <!-- Formulaire -->
        <footer class="border-top p-3">

            <form id="formChat"
                    th:if="${conversation == null}"
                  th:action="@{/conversations}"
                  method="post">

                <div class="input-group">
                    <textarea name="prompt"
                              class="form-control"
                              rows="2"
                              placeholder="Posez votre question..."
                              required></textarea>

                    <button class="btn btn-primary" type="submit">
                        Envoyer
                    </button>
                </div>

            </form>

            <form th:if="${conversation != null}"
                  th:action="@{/conversations/{id}/messages(id=${conversation.id})}"
                  method="post">

                <div class="input-group">
                    <textarea name="prompt"
                              class="form-control"
                              rows="2"
                              placeholder="Écrivez votre message..."
                              required></textarea>

                    <button class="btn btn-primary" type="submit">
                        Envoyer
                    </button>
                </div>

            </form>

        </footer>

    </main>

</div>

<script th:src="@{/js/formatMD.js}"></script>
</body>
</html>
