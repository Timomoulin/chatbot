
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Test API Mistral</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <h1 class="mb-4">Test de l'API Mistral</h1>

    <div class="card shadow-sm">
        <div class="card-body">

            <form th:action="@{/chat}" method="post">

                <div class="mb-3">
                    <label for="prompt" class="form-label">
                        Votre prompt
                    </label>

                    <textarea
                            class="form-control"
                            id="prompt"
                            name="prompt"
                            rows="5"
                            placeholder="Posez votre question..."
                            required
                            th:text="${prompt}">
                    </textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Envoyer à Mistral
                </button>

            </form>

        </div>
    </div>

    <!-- Réponse de Mistral -->
    <div th:if="${reponse}" class="card mt-4 shadow-sm">
        <div class="card-header">
            Réponse de Mistral
        </div>

        <div class="card-body">
            <p class="mb-0" style="white-space: pre-wrap;"
               th:text="${reponse}">
            </p>
        </div>
    </div>

    <!-- Message d'erreur -->
    <div th:if="${erreur}" class="alert alert-danger mt-4"
         th:text="${erreur}">
    </div>

</div>

</body>
</html>
