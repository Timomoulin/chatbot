
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Conversation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <a th:href="@{/}" class="text-decoration-none">
                &larr; Retour aux conversations
            </a>

            <h1 class="h3 mt-2" th:text="${conversation?.titre}"></h1>
        </div>

    </div>

    <!-- Historique des messages -->
    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <div th:if="${#lists.isEmpty(messages)}"
                 class="text-muted">
                Aucun message.
            </div>

            <div th:each="message : ${messages}"
                 class="mb-4">

                <div class="d-flex justify-content-between">

                    <strong
                            th:text="${message.typeMessage}">
                    </strong>

                    <small class="text-muted"
                           th:text="${#temporals.format(message.dateCreation, 'dd/MM/yyyy HH:mm')}">
                    </small>

                </div>

                <div class="mt-2 p-3 rounded bg-light"
                     style="white-space: pre-wrap;"
                     th:text="${message.contenu}">
                </div>

            </div>

        </div>
    </div>

    <!-- Formulaire d'envoi -->
    <div class="card shadow-sm">

        <div class="card-body">
            <div th:if="${#lists.isEmpty(conversations)}"
                 class="text-muted">
                <form th:action="@{/conversations}"
                      method="post">

                    <div class="mb-3">
                        <label for="prompt" class="form-label">
                            Votre message
                        </label>

                        <textarea
                                class="form-control"
                                id="prompt"
                                name="prompt"
                                rows="3"
                                placeholder="Écrivez votre message..."
                                required>
                    </textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Envoyer
                    </button>

                </form>
            </div>

        </div>
    </div>

</div>

</body>
</html>
